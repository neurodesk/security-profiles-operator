name: Build neurodesk image
on:
  push:
    branches: [neurodesk]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ./go.mod

      - name: Build binary
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
            -trimpath -ldflags '-s -w' \
            -o security-profiles-operator \
            ./cmd/security-profiles-operator
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
            -trimpath -ldflags '-s -w' \
            -o spoc \
            ./cmd/spoc

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        run: |
          cat > Dockerfile.neurodesk <<'EOF'
          FROM gcr.io/distroless/static:nonroot
          COPY security-profiles-operator /security-profiles-operator
          COPY spoc /spoc
          USER 65535:65535
          ENTRYPOINT ["/security-profiles-operator"]
          EOF
          docker build -f Dockerfile.neurodesk -t ghcr.io/neurodesk/security-profiles-operator:latest .
          docker push ghcr.io/neurodesk/security-profiles-operator:latest
